name: TacoExpress CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/toma_pedidos
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    name: Build y pruebas de TacoExpress
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java para compilar Android
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Instalar Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Descargar las dependencias del proyecto
      - name: Instalar dependencias
        run: flutter pub get

      # 5. Realizar análisis estático del código
      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      # 6. Ejecutar las pruebas
      - name: Ejecutar pruebas
        run: flutter test

      # 7. Construir el APK de Android
      - name: Construir APK
        run: flutter build apk --debug

      # 8. Guardar el APK generado como artefacto
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: tacoexpress-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # 9. Construir la imagen Docker
      - name: Construir imagen Docker
        run: docker build -t tacoexpress .
